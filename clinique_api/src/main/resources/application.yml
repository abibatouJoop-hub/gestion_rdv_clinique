spring:
  application:
    name: clinique_api
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations:
      - classpath:db/migration/catalogue
      - classpath:db/migration/acteurs
      - classpath:db/migration/transactions
      - classpath:db/migration/notifications

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  admin:
    email: ${ADMIN_EMAIL:}
    mot-de-passe: ${ADMIN_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}